{% extends 'main/base.html' %}
{% block title %}Add Product | Shop Fusion{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
        <div class="card auth-card">
            <div class="card-body">
                <div class="text-center mb-4">
                    <div class="bg-primary bg-opacity-10 rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width:64px;height:64px;">
                        <i class="bi bi-plus-circle text-primary fs-3"></i>
                    </div>
                    <h2 class="h4 fw-bold">Add a Product</h2>
                    <p class="text-muted small mb-0">Fill in the details to list your product in the store.</p>
                </div>

                <form method="POST" enctype="multipart/form-data" novalidate>
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="name" class="form-label fw-medium">Name</label>
                        <input type="text" name="name" id="name" class="form-control"
                               value="{{ name|default:'' }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label fw-medium">Description</label>
                        <textarea name="description" id="description" class="form-control" rows="4" required>{{ description|default:'' }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label for="price" class="form-label fw-medium">Price</label>
                        <input type="number" name="price" id="price" class="form-control"
                               value="{{ price|default:'' }}" min="0" required>
                    </div>

                    <div class="mb-3">
                        <label for="image" class="form-label fw-medium">Image</label>
                        <input type="file" name="image" id="image" class="form-control" accept="image/*">
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 mt-2">
                        <i class="bi bi-plus-lg me-1"></i> Add Product
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
