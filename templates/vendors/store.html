{% extends 'main/base.html' %}
{% block title %}{{ store.store_name }} | Shop Fusion{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="bg-primary text-white p-4">
                <div class="d-flex align-items-center gap-3">
                    <div class="bg-white bg-opacity-25 rounded-circle d-flex align-items-center justify-content-center" style="width:56px;height:56px;">
                        <i class="bi bi-shop fs-4"></i>
                    </div>
                    <div>
                        <h1 class="h3 fw-bold mb-0">{{ store.store_name }}</h1>
                        <p class="mb-0 opacity-75 small">Store Dashboard</p>
                    </div>
                </div>
            </div>
            <div class="card-body p-4">
                <div class="row g-3 mb-4">
                    <div class="col-sm-6">
                        <div class="p-3 bg-light rounded-3">
                            <div class="text-muted small mb-1">Store ID</div>
                            <div class="fw-semibold">#{{ store.id }}</div>
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <div class="p-3 bg-light rounded-3">
                            <div class="text-muted small mb-1">Owner</div>
                            <div class="fw-semibold">{{ store.user }}</div>
                        </div>
                    </div>
                </div>

                <h6 class="text-uppercase text-muted small mb-3">Actions</h6>
                <div class="d-flex flex-wrap gap-2">
                    <a href="{% url 'products:add-product' store.id %}" class="btn btn-primary">
                        <i class="bi bi-plus-lg me-1"></i> Add Product
                    </a>
                    <a href="{% url 'home' %}" class="btn btn-outline-secondary">
                        <i class="bi bi-house me-1"></i> Back to Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
