{% extends 'main/base.html' %}
{% block title %}Register Store | Shop Fusion{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
        <div class="card auth-card">
            <div class="card-body">
                <div class="text-center mb-4">
                    <div class="bg-primary bg-opacity-10 rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width:64px;height:64px;">
                        <i class="bi bi-shop text-primary fs-3"></i>
                    </div>
                    <h2 class="h4 fw-bold">Create a Store</h2>
                    <p class="text-muted small mb-0">Register your vendor store and start selling on Shop Fusion</p>
                </div>

                <form method="POST" novalidate>
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="store_name" class="form-label fw-medium">Store name</label>
                        <input type="text" name="store_name" id="store_name" class="form-control"
                               value="{{ store_name|default:'' }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label fw-medium">Description</label>
                        <input type="text" name="description" id="description" class="form-control"
                               value="{{ description|default:'' }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="business_email" class="form-label fw-medium">Business email</label>
                        <input type="email" name="business_email" id="business_email" class="form-control"
                               value="{{ business_email|default:'' }}" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 mt-2">
                        <i class="bi bi-check-lg me-1"></i> Create Store
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
