{% extends 'main/base.html' %}
{% block title %}Your Profile | Shop Fusion{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4">
                <div class="d-flex align-items-center gap-3 mb-4">
                    <div class="bg-primary bg-opacity-10 rounded-circle d-flex align-items-center justify-content-center" style="width:64px;height:64px;">
                        <i class="bi bi-person-fill text-primary fs-3"></i>
                    </div>
                    <div>
                        <h1 class="h4 fw-bold mb-0">{{ user.username }}</h1>
                        <p class="text-muted small mb-0">Your account dashboard</p>
                    </div>
                </div>

                <hr>

                <h6 class="text-uppercase text-muted small mb-3">Quick Actions</h6>
                <div class="d-grid gap-2">
                    <a href="{% url 'register-store' %}" class="btn btn-outline-primary d-flex align-items-center justify-content-between">
                        <span><i class="bi bi-shop me-2"></i> Create / Manage Store</span>
                        <i class="bi bi-chevron-right"></i>
                    </a>
                    <a href="{% url 'home' %}" class="btn btn-outline-secondary d-flex align-items-center justify-content-between">
                        <span><i class="bi bi-bag me-2"></i> Continue Shopping</span>
                        <i class="bi bi-chevron-right"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
