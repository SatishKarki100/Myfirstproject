{% extends 'main/base.html' %}
{% block title %}Your Profile | Shop Fusion{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4">
                <h1 class="h4 fw-bold mb-1">{{ user.username }}</h1>
                <p class="text-muted small mb-3">Role: <strong>{{ user.role }}</strong></p>
                <hr>
                <div class="d-grid gap-2">
                    {% if user.role == 'vendor' %}
                    <a href="{% url 'products:add-product' %}" class="btn btn-outline-primary">Add product</a>
                    {% endif %}
                    <a href="{% url 'cart' %}" class="btn btn-outline-secondary">My cart</a>
                    <a href="{% url 'orders' %}" class="btn btn-outline-secondary">My orders</a>
                    <a href="{% url 'home' %}" class="btn btn-outline-secondary">Continue shopping</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
