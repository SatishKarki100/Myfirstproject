{% extends 'main/base.html' %}
{% block title %}Create Account | Shop Fusion{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
        <div class="card auth-card">
            <div class="card-body">
                <div class="text-center mb-4">
                    <div class="bg-primary bg-opacity-10 rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width:64px;height:64px;">
                        <i class="bi bi-person-plus text-primary fs-3"></i>
                    </div>
                    <h2 class="h4 fw-bold">Create an Account</h2>
                    <p class="text-muted small mb-0">Join Shop Fusion and start shopping today</p>
                </div>

                <form method="POST" novalidate>
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="username" class="form-label fw-medium">Username</label>
                        <input type="text" name="username" id="username" class="form-control"
                               value="{{ username|default:'' }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="first_name" class="form-label fw-medium">First name</label>
                        <input type="text" name="first_name" id="first_name" class="form-control"
                               value="{{ first_name|default:'' }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="middlename" class="form-label fw-medium">Middle name</label>
                        <input type="text" name="middlename" id="middlename" class="form-control"
                               value="{{ middlename|default:'' }}">
                    </div>

                    <div class="mb-3">
                        <label for="last_name" class="form-label fw-medium">Last name</label>
                        <input type="text" name="last_name" id="last_name" class="form-control"
                               value="{{ last_name|default:'' }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-medium">Email</label>
                        <input type="email" name="email" id="email" class="form-control"
                               value="{{ email|default:'' }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-medium">Password</label>
                        <input type="password" name="password" id="password" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="password2" class="form-label fw-medium">Confirm password</label>
                        <input type="password" name="password2" id="password2" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 mt-2">
                        <i class="bi bi-check-lg me-1"></i> Sign Up
                    </button>
                </form>

                <p class="text-center text-muted small mt-4 mb-0">
                    Already have an account?
                    <a href="{% url 'login' %}" class="fw-semibold text-decoration-none">Log In</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
