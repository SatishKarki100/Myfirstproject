{% extends 'main/base.html' %}
{% block title %}Create Account | Shop Fusion{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
        <div class="card auth-card">
            <div class="card-body">
                <div class="text-center mb-4">
                    <h2 class="h4 fw-bold">Create an Account</h2>
                    <p class="text-muted small mb-0">Join Shop Fusion</p>
                </div>
                <form method="POST" novalidate>
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-medium">Username</label>
                        <input type="text" name="username" class="form-control" value="{{ username|default:'' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">First name</label>
                        <input type="text" name="first_name" class="form-control" value="{{ first_name|default:'' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Middle name</label>
                        <input type="text" name="middlename" class="form-control" value="{{ middlename|default:'' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Last name</label>
                        <input type="text" name="last_name" class="form-control" value="{{ last_name|default:'' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Email</label>
                        <input type="email" name="email" class="form-control" value="{{ email|default:'' }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Confirm password</label>
                        <input type="password" name="password2" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">I want to</label>
                        <select name="role" class="form-select">
                            <option value="user" {% if role == 'user' %}selected{% endif %}>Buy products (User)</option>
                            <option value="vendor" {% if role == 'vendor' %}selected{% endif %}>Sell products (Vendor)</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Sign Up</button>
                </form>
                <p class="text-center text-muted small mt-4 mb-0">
                    Already have an account? <a href="{% url 'login' %}">Log In</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
