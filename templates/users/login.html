{% extends 'main/base.html' %}
{% block title %}Login | Shop Fusion{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
        <div class="card auth-card">
            <div class="card-body">
                <div class="text-center mb-4">
                    <div class="bg-primary bg-opacity-10 rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width:64px;height:64px;">
                        <i class="bi bi-person-lock text-primary fs-3"></i>
                    </div>
                    <h2 class="h4 fw-bold">Welcome back</h2>
                    <p class="text-muted small mb-0">Sign in to your Shop Fusion account</p>
                </div>

                <form method="POST" novalidate>
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="username" class="form-label fw-medium">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" id="username" class="form-control"
                                   value="{{ username|default:'' }}" placeholder="Enter username" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-medium">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" id="password" class="form-control"
                                   placeholder="Enter password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 mt-2">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                    </button>
                </form>

                <p class="text-center text-muted small mt-4 mb-0">
                    Don't have an account?
                    <a href="{% url 'register' %}" class="fw-semibold text-decoration-none">Sign Up</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
